<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dost - Final Fixed</title>
<style>
  /* ROBOT LOGO HIDE - FINAL FIX */
  .grecaptcha-badge { visibility: hidden !important; display: none !important; opacity:0 !important; pointer-events:none !important; }
  *{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;}
  body{background:#000;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
  .card{background:#111;border:1px solid #333;border-radius:28px;padding:24px;width:100%;max-width:380px;}
  h1{text-align:center;font-size:24px;font-weight:700;}
  .sub{color:#888;text-align:center;margin:8px 0 28px;font-size:14px;}
  input{width:100%;background:#1C1C1E;border:1px solid #2C2C2E;color:#fff;padding:16px;border-radius:16px;margin-bottom:12px;outline:none;font-size:16px;}
  .btn-main{width:100%;background:linear-gradient(to right, #FF2D7A, #FF7A45);color:#fff;padding:16px;border-radius:16px;font-weight:700;font-size:16px;border:none;cursor:pointer;}
  .btn-back{width:100%;background:#1C1C1E;color:#fff;padding:16px;border-radius:16px;margin-top:12px;font-weight:700;border:none;cursor:pointer;}
  .status{color:#00FF88;text-align:center;margin-top:20px;font-size:14px;display:none;}
  #homePage{display:none;width:100%;max-width:500px;}
  #homePage h2{font-size:28px;margin-bottom:10px;}
</style>
</head>
<body>

<div id="loginPage" class="card">
  <h1>💖 Dil Se Dil Tak</h1>
  <p class="sub">Phone OTP se login karo</p>
  <input id="otpInput" value="123456" placeholder="OTP daalo" />
  <button class="btn-main" onclick="handleVerify()">Verify Karo</button>
  <button class="btn-back" onclick="history.back()">Wapas</button>
  <p id="statusText" class="status">🎉 Login ho gaya! +918127578839</p>
</div>

<div id="homePage">
  <h2>🔥 Profile Banao</h2>
  <p style="color:#aaa;margin:20px 0;">Login successful! Ab yahan profiles dikhenge.</p>
  <div style="background:#111;border-radius:20px;padding:20px;border:1px solid #333;">
    <p>✅ Robot logo hat gaya</p>
    <p>✅ Login ke baad Home pe aa gaye</p>
    <p>✅ Fix ho gaya bhai!</p>
  </div>
  <button class="btn-back" style="margin-top:20px;background:#222;" onclick="showLogin()">Logout</button>
</div>

<div id="recaptcha-container"></div>

<script>
function handleVerify(){
  let otp = document.getElementById('otpInput').value;
  if(!otp){ alert('OTP daalo'); return; }
  let status = document.getElementById('statusText');
  status.style.display = 'block';
  status.innerText = '🎉 Login ho gaya! +918127578839';
  
  // 1 sec baad home pe redirect
  setTimeout(()=>{
    document.getElementById('loginPage').style.display='none';
    document.getElementById('homePage').style.display='block';
    document.body.style.alignItems='flex-start';
    document.body.style.paddingTop='30px';
  }, 1000);
}
function showLogin(){
  document.getElementById('homePage').style.display='none';
  document.getElementById('loginPage').style.display='block';
  document.getElementById('statusText').style.display='none';
  document.body.style.alignItems='center';
}
</script>
</body>
</html>
